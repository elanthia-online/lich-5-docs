name: Validate Documentation

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Validate specific file (leave empty for all files)'
        required: false
        type: string
      strict:
        description: 'Fail on YARD warnings'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: YARD Documentation Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install YARD
        run: gem install yard

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Validate all documented files
        if: inputs.file == ''
        run: |
          if [ "${{ inputs.strict }}" == "true" ]; then
            python scripts/validate_docs.py --dir documented --strict
          else
            python scripts/validate_docs.py --dir documented
          fi

      - name: Validate specific file
        if: inputs.file != ''
        run: |
          if [ "${{ inputs.strict }}" == "true" ]; then
            python scripts/validate_docs.py --dir documented --file "${{ inputs.file }}" --strict
          else
            python scripts/validate_docs.py --dir documented --file "${{ inputs.file }}"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### YARD Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.file }}" != "" ]; then
            echo "**File:** ${{ inputs.file }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Scope:** All documented files" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Strict mode:** ${{ inputs.strict }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for any YARD warnings or errors." >> $GITHUB_STEP_SUMMARY
